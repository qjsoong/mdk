# Repository-wide mdk configuration; used by CI and by contributors who
# run `mdk` from the checkout.
dialect = "gfm"

[lint]
# MD013 keeps its default warning severity and 80-column limit; only the
# exceptions below are configured.
[lint.rules.MD013]
# README examples deliberately show raw tool output that can be long, and
# tables are laid out by the formatter rather than wrapped.
code_blocks = false
tables = false

[lint.rules.MD024]
# Changelog sections repeat under each release heading.
siblings_only = true

[fmt]
line_width = 80
heading_style = "atx"
line_ending = "lf"
